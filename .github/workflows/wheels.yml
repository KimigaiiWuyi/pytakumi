name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "python/**"
      - "scripts/**"
      - "tests/**"
      - "vendor/**"
      - "pyproject.toml"
      - ".gitmodules"
      - ".github/workflows/wheels.yml"

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "8388608"

jobs:
  # -------------------------------------------------------------------------
  # Linux: manylinux + musllinux. musl needs large pthread stacks (see
  # scripts/cibw_test.py + src/lib.rs pthread_setattr_default_np).
  # -------------------------------------------------------------------------
  linux:
    name: Linux wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          allow-prereleases: true
      - name: Verify cibw test runner is present
        run: test -f scripts/cibw_test.py && head -5 scripts/cibw_test.py
      - name: Build & test wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_ALL_LINUX: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.0
          # Must not replace pyproject musl overrides entirely — only host PATH + stack.
          # Test command is forced here so tags never re-run the old split import/pytest.
          CIBW_ENVIRONMENT_LINUX: PATH=$HOME/.cargo/bin:$PATH RUST_MIN_STACK=8388608
          CIBW_TEST_COMMAND: >
            bash -c 'ulimit -s unlimited 2>/dev/null || ulimit -s 65536 2>/dev/null || true;
            export CIBW_PROJECT={project};
            python {project}/scripts/cibw_test.py'
          CIBW_BUILD_VERBOSITY: 1
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist/*.whl

  # -------------------------------------------------------------------------
  # macOS: macos-13 is retired (no runners). Use macos-15-intel for x86_64
  # and macos-14 (Apple Silicon) for arm64.
  # https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/
  # -------------------------------------------------------------------------
  macos:
    name: macOS wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          allow-prereleases: true
      - name: Build & test wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: MACOSX_DEPLOYMENT_TARGET=11.0 RUST_MIN_STACK=8388608
          CIBW_BUILD_VERBOSITY: 1
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: dist/*.whl

  # -------------------------------------------------------------------------
  # Windows: cibuildwheel arch ids AMD64 / ARM64.
  # -------------------------------------------------------------------------
  windows:
    name: Windows wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: AMD64
          - runner: windows-11-arm
            arch: ARM64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          allow-prereleases: true
      - name: Build & test wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: RUST_MIN_STACK=8388608
          CIBW_BUILD_VERBOSITY: 1
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.arch }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install -U maturin
          maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist
          echo "--- wheel inventory ---"
          ls -1 dist/*.whl | sed 's|.*/||' | sort
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
