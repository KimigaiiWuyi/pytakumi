[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "pytakumi"
version = "0.1.0"
description = "Render HTML, Markdown, and node trees to images without a browser (Takumi Python bindings)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "pytakumi contributors" }]
keywords = [
  "takumi",
  "og-image",
  "screenshot",
  "html",
  "markdown",
  "render",
  "css",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
markdown = ["markdown-it-py>=3.0,<5"]
bench = [
  "pillow>=10.0",
  "psutil>=5.9",
  "playwright>=1.40",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "markdown-it-py>=3.0,<5",
  "pillow>=10.0",
  "psutil>=5.9",
]

[project.urls]
Homepage = "https://takumi.kane.tw"
Documentation = "https://takumi.kane.tw/docs/"
# Engine upstream (this package is a Python binding layer):
Source = "https://github.com/kane50613/takumi"
# Set Repository to your pytakumi remote when you publish the binding repo.
Repository = "https://github.com/KimigaiiWuyi/pytakumi"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pytakumi._native"
python-source = "python"
include = [
  { path = "python/pytakumi/py.typed", format = "sdist" },
  { path = "python/pytakumi/*.pyi", format = ["sdist", "wheel"] },
  { path = "python/pytakumi/templates/*", format = ["sdist", "wheel"] },
  { path = "vendor/takumi/**/*", format = "sdist" },
  { path = ".gitmodules", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error",
  # Optional deps / third-party noise
  "ignore::DeprecationWarning",
]
markers = [
  "slow: longer-running tests",
  "concurrency: multi-thread render tests",
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "pp* *-musllinux_i686 *-manylinux_i686 *win32 *i686"
test-requires = "pytest markdown-it-py"
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.linux]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.0"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
