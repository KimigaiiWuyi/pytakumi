<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 800px;
    height: 420px;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #0ea5e9 160%);
    color: #f8fafc;
  }
  .card {
    width: 800px;
    height: 420px;
    padding: 48px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(14, 165, 233, 0.2);
    border: 1px solid rgba(125, 211, 252, 0.45);
    color: #7dd3fc;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  h1 {
    margin: 18px 0 12px;
    font-size: 52px;
    line-height: 1.15;
    font-weight: 800;
  }
  p {
    margin: 0;
    font-size: 22px;
    line-height: 1.5;
    color: rgba(248, 250, 252, 0.82);
    max-width: 620px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    color: rgba(248, 250, 252, 0.7);
  }
  .metric {
    font-size: 28px;
    font-weight: 700;
    color: #fbbf24;
  }
</style>
</head>
<body>
  <div class="card">
    <div>
      <span class="badge">BENCHMARK</span>
      <h1>Takumi 压测卡片</h1>
      <p>用于对比 Pillow / Playwright / htmlkit / takumi 的速度、内存与排版一致性。</p>
    </div>
    <div class="footer">
      <span>layout-check · flex · gradient</span>
      <span class="metric">800×420</span>
    </div>
  </div>
</body>
</html>
